const META={ELA:['🐬','Ocean explorers, biography & vocabulary'],Grammar:['✍️','Action verbs and past / present tense'],Maths:['➗','Division and equal groups'],Science:['🌱','Growth, living things and pollination'],'Social Studies':['🌍','Natural disasters, communities, and history']};
let subject='',order=[],idx=0,score=0,choice=null,history=[];
const app=document.getElementById('app');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){subject='';app.innerHTML=`<div class="hero"><div class="heroicon">🎈 🧠 🌈</div><h1>Review Week 2</h1><p class="sub">Choose a subject and collect stars.<br>Answer 20 fun questions in each subject!</p></div><div class="subjects">${Object.entries(META).map(([s,v])=>`<button class="subject" onclick="start('${s}')"><span class="emoji">${v[0]}</span><strong>${s}</strong><small>${v[1]} · 20 questions</small></button>`).join('')}</div>`}
function start(s){subject=s;order=BANK[s].map((x,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;choice=null;history=[];render()}
function render(){if(idx>=20)return finish();let q=BANK[subject][order[idx]];app.innerHTML=`<div class="panel"><div class="toolbar"><button class="back" onclick="home()">← Subjects</button><span class="pill">${META[subject][0]} ${subject} · ${idx+1}/20</span><span class="pill">⭐ ${score}</span></div><div class="progress"><div style="width:${(idx/20)*100}%"></div></div><div class="art" aria-hidden="true">${q.emoji}</div><div class="question">${idx+1}. ${escapeHTML(q.q)}</div><div class="options">${q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i})"><span class="letter">${'ABCD'[i]}</span><span>${escapeHTML(o)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="next" class="primary" onclick="next()" style="display:none">${idx===19?'See Results 🎉':'Next Question →'}</button></div></div>`}
function answer(i){if(choice!==null)return;let q=BANK[subject][order[idx]];choice=i;let correct=i===q.answer;if(correct)score++;history.push({q:q.q,answer:q.opts[q.answer],chosen:q.opts[i],correct});q.opts.forEach((_,j)=>{let el=document.getElementById('opt'+j);el.disabled=true;if(j===q.answer)el.classList.add('good');else if(j===i)el.classList.add('bad')});let f=document.getElementById('feedback');f.className='feedback '+(correct?'good':'bad');f.textContent=correct?'🌟 Good job! You got it!':'💛 Good try! Correct answer: '+q.opts[q.answer];document.getElementById('next').style.display='inline-block'}
function next(){if(choice===null)return;idx++;choice=null;render()}
function finish(){let pct=score/20;app.innerHTML=`<div class="panel results"><div style="font-size:65px">${pct>=.8?'🏆':pct>=.5?'🎉':'🌈'}</div><h1>Great effort!</h1><div class="score">${score} / 20 ⭐</div><p class="sub">${pct>=.8?'Amazing work!':pct>=.5?'Keep practising. You are learning!':'Every try helps you learn. Good try!'}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="primary" onclick="start('${subject}')">Play Again ↻</button><button class="primary" style="background:#8a8fa6" onclick="home()">Other Subjects</button></div><details class="review"><summary>Review all answers</summary>${history.map((h,i)=>`<p>${h.correct?'✅':'💛'} <strong>${i+1}. ${escapeHTML(h.q)}</strong><br>Your answer: ${escapeHTML(h.chosen)}<br>Correct answer: ${escapeHTML(h.answer)}</p>`).join('')}</details></div>`}

</script></body></html>
